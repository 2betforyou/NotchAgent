name: Feature request
description: Suggest an idea or improvement. (기능 제안 · 한국어로 작성해도 됩니다)
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the situation or problem first, before the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
      description: Your idea, and how you'd expect it to work in the notch, preview, or workspace.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Anything you've tried instead? (optional)
